HTML

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOMA SOCIAL</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
}
header {
  background: #075e54;
  color: white;
  padding: 18px;
  font-size: 25px;
  font-weight: bold;
}
.container {
  max-width: 500px;
  margin: auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 18px;
  margin: 12px 0;
  border-radius: 12px;
}
input, button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #ddd;
  border-radius: 7px;
  font-size: 16px;
}
button {
  background: #075e54;
  color: white;
  border: none;
  font-weight: bold;
}
button:active {
  opacity: .8;
}
.status {
  display: inline-block;
  background: #e6f5ee;
  padding: 12px;
  margin: 5px;
  border-radius: 12px;
}
.status img, .post img, .post video {
  max-width: 100%;
  border-radius: 10px;
}
.post {
  background: white;
  padding: 15px;
  margin: 12px 0;
  border-radius: 12px;
}
.hidden {
  display: none;
}
</style>
</head>

<body>

<header>DOMA SOCIAL 🌍</header>

<div class="container">

<div id="auth" class="card">
<h2>Create Account</h2>
<input id="name" placeholder="Your Full Name">
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Create Password">
<button onclick="signup()">Sign Up</button>
<hr>
<h3>Already have an account?</h3>
<input id="loginEmail" placeholder="Email Address">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Sign In</button>
<p id="message"></p>
</div>

<div id="home" class="hidden">

<div class="card">
<h2>Welcome to DOMA SOCIAL</h2>
<p id="welcome"></p>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>📸 Create Status</h3>
<input type="file" id="statusFile" accept="image/*,video/*">
<button onclick="addStatus()">Post Status</button>
<div id="statuses"></div>
</div>

<div class="card">
<h3>📝 Create Post</h3>
<input id="postText" placeholder="What's on your mind?">
<input type="file" id="postFile" accept="image/*,video/*">
<button onclick="addPost()">Share Post</button>
</div>

<h3>News Feed</h3>
<div id="feed"></div>

</div>
</div>

<script>
let users = JSON.parse(localStorage.getItem("domaUsers")) || [];
let currentUser = localStorage.getItem("domaCurrentUser");

function saveUsers() {
  localStorage.setItem("domaUsers", JSON.stringify(users));
}

function signup() {
  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim().toLowerCase();
  let password = document.getElementById("password").value;

  if (!name || !email || !password) {
    message.textContent = "Fill all fields!";
    return;
  }

  if (users.some(u => u.email === email)) {
    message.textContent = "Email already registered!";
    return;
  }

  users.push({name, email, password});
  saveUsers();
  currentUser = email;
  localStorage.setItem("domaCurrentUser", email);
  showHome();
}

function login() {
  let email = document.getElementById("loginEmail").value.trim().toLowerCase();
  let password = document.getElementById("loginPassword").value;

  let user = users.find(u => u.email === email && u.password === password);

  if (!user) {
    message.textContent = "Incorrect email or password!";
    return;
  }

  currentUser = email;
  localStorage.setItem("domaCurrentUser", email);
  showHome();
}

function showHome() {
  let user = users.find(u => u.email === currentUser);
  if (!user) return;

  document.getElementById("auth").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("welcome").textContent = "Welcome, " + user.name;

  showPosts();
  showStatuses();
}

function logout() {
  localStorage.removeItem("domaCurrentUser");
  location.reload();
}

function addStatus() {
  let file = document.getElementById("statusFile").files[0];
  if (!file) {
    alert("Choose a photo or video first!");
    return;
  }

  if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) {
    alert("Choose an image or video!");
    return;
  }

  let reader = new FileReader();
  reader.onload = function() {
    let statuses = JSON.parse(localStorage.getItem("domaStatuses")) || [];
    statuses.unshift({
      user: currentUser,
      file: reader.result,
      type: file.type
    });
    localStorage.setItem("domaStatuses", JSON.stringify(statuses));
    document.getElementById("statusFile").value = "";
    showStatuses();
  };
  reader.readAsDataURL(file);
}

function showStatuses() {
  let statuses = JSON.parse(localStorage.getItem("domaStatuses")) || [];
  document.getElementById("statuses").innerHTML = statuses.map(s =>
    `<div class="status">
      <b>${escapeHTML(s.user)}</b><br>
      ${s.type.startsWith("video/")
        ? `<video src="${s.file}" controls width="180"></video>`
        : `<img src="${s.file}" width="180">`}
    </div>`
  ).join("");
}

function addPost() {
  let text = document.getElementById("postText").value.trim();
  let file = document.getElementById("postFile").files[0];

  if (!text && !file) {
    alert("Write something or choose a photo!");
    return;
  }

  function savePost(image) {
    let posts = JSON.parse(localStorage.getItem("domaPosts")) || [];
    posts.unshift({
      user: currentUser,
      text: text,
      image: image
    });
    localStorage.setItem("domaPosts", JSON.stringify(posts));
    document.getElementById("postText").value = "";
    document.getElementById("postFile").value = "";
    showPosts();
  }

  if (file) {
    if (!file.type.startsWith("image/")) {
      alert("For now, choose an image for your post.");
      return;
    }
    let reader = new FileReader();
    reader.onload = () => savePost(reader.result);
    reader.readAsDataURL(file);
  } else {
    savePost("");
  }
}

function showPosts() {
  let posts = JSON.parse(localStorage.getItem("domaPosts")) || [];
  document.getElementById("feed").innerHTML = posts.map(p =>
    `<div class="post">
      <b>${escapeHTML(p.user)}</b>
      <p>${escapeHTML(p.text)}</p>
      ${p.image ? `<img src="${p.image}">` : ""}
    </div>`
  ).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

if (currentUser && users.some(u => u.email === currentUser)) {
  showHome();
}
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</body>
</html>
